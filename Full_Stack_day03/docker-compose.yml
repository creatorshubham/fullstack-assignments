services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: book_catalog
      MYSQL_USER: book_catalog
      MYSQL_PASSWORD: ${DB_PASSWORD:-book_catalog_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: book_catalog
      DB_USERNAME: book_catalog
      DB_PASSWORD: ${DB_PASSWORD:-book_catalog_dev}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
